[project]
name = "rag-govt"
version = "0.1.0"
description = "RAG pipeline over Indian government scheme PDFs"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "qdrant-client>=1.9.0",
    "sentence-transformers>=3.0.0",
    "google-genai>=0.4.0",
    "pydantic-settings>=2.2.0",
    "pymupdf>=1.24.0",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "httpx>=0.27.0",
    "ragas>=0.1.0",
    "datasets>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_govt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
